# Openship Actions: one button = "are my Supabase keys set, and are any still
# the insecure .env.example defaults?" It NEVER prints secret values: only
# set/missing, an 8-hex-char sha256 fingerprint (to compare with your password
# manager: printf %s "$VALUE" | sha256sum | cut -c1-8), and the values that are
# public by design (URLs, ANON_KEY, SUPABASE_PUBLISHABLE_KEY, DASHBOARD_USERNAME).
# As a second line of defence every secret value is registered with
# ::add-mask:: before anything else is printed, so the runner replaces it with
# *** should it ever appear in this run's log.
# To READ a secret, use the supabase-manager service's Terminal tab in
# Openship (sh /srv/supabase/run.sh secrets) - never a workflow/job, whose
# output is stored in run history and may be sent to notification channels.
name: "Supabase: secrets check (no values)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, openship, linux]
    timeout-minutes: 5
    env:
      OPENSHIP_PROJECT_ID: ${{ vars.OPENSHIP_PROJECT_ID }}
    steps:
      - name: check .env (fingerprints only)
        shell: bash
        run: |
          set -euo pipefail
          # Locate the manager container by the label Openship stamps on every
          # compose service container (name changes briefly during a cutover).
          # Optional repo/workflow variable OPENSHIP_PROJECT_ID narrows the match.
          filter=(--filter label=openship.service=supabase-manager --filter status=running)
          [ -z "${OPENSHIP_PROJECT_ID:-}" ] || filter+=(--filter "label=openship.project=${OPENSHIP_PROJECT_ID}")
          C=$(docker ps -q "${filter[@]}")
          n=$(printf "%s\n" "$C" | grep -c . || true)
          if [ "$n" != 1 ]; then
            echo "::error::Expected exactly 1 running supabase-manager container, found ${n}. Is the project deployed / mid-redeploy? Retry in a minute."
            docker ps -a --filter label=openship.service=supabase-manager --format "{{.Names}}  {{.Status}}" || true
            exit 1
          fi
          # Runs inside the manager container (it has /srv/supabase/.env).
          # The script is single-quoted: nothing is expanded on the runner side.
          # shellcheck disable=SC2016
          docker exec "$C" bash -c '
            set -euo pipefail
            cd "${SUPABASE_DIR:-/srv/supabase}"
            [ -f .env ] || { echo "::error::no .env in $PWD yet (stack not installed?)"; exit 1; }
            SECRET="POSTGRES_PASSWORD JWT_SECRET SERVICE_ROLE_KEY SUPABASE_SECRET_KEY JWT_KEYS JWT_JWKS
                    DASHBOARD_PASSWORD SECRET_KEY_BASE REALTIME_DB_ENC_KEY VAULT_ENC_KEY PG_META_CRYPTO_KEY
                    LOGFLARE_PUBLIC_ACCESS_TOKEN LOGFLARE_PRIVATE_ACCESS_TOKEN S3_PROTOCOL_ACCESS_KEY_ID
                    S3_PROTOCOL_ACCESS_KEY_SECRET SERVICE_ROLE_KEY_ASYMMETRIC MINIO_ROOT_PASSWORD SMTP_PASS
                    OPENAI_API_KEY"
            REQUIRED="POSTGRES_PASSWORD JWT_SECRET ANON_KEY SERVICE_ROLE_KEY DASHBOARD_USERNAME
                      DASHBOARD_PASSWORD SECRET_KEY_BASE REALTIME_DB_ENC_KEY VAULT_ENC_KEY PG_META_CRYPTO_KEY
                      LOGFLARE_PUBLIC_ACCESS_TOKEN LOGFLARE_PRIVATE_ACCESS_TOKEN SUPABASE_PUBLIC_URL
                      API_EXTERNAL_URL SITE_URL"
            PUBLIC="SUPABASE_PUBLIC_URL API_EXTERNAL_URL SITE_URL DASHBOARD_USERNAME ANON_KEY SUPABASE_PUBLISHABLE_KEY"
            # collapse the multi-line lists to single spaces (for the " $LIST " matches below)
            SECRET=$(echo $SECRET); REQUIRED=$(echo $REQUIRED)
            Q=$(printf "\047")  # a single quote character
            get() {  # get <file> <KEY>: value of the first KEY= line, quotes stripped (file is never sourced)
              local v
              v=$(grep -m1 "^$2=" "$1" 2>/dev/null | cut -d= -f2- | tr -d "\r") || true
              v=${v#\"}; v=${v%\"}; v=${v#"$Q"}; v=${v%"$Q"}
              printf "%s" "$v"
            }
            # 1) register every secret value as a mask BEFORE any other output
            for k in $SECRET; do
              v=$(get .env "$k")
              [ -z "$v" ] || printf "::add-mask::%s\n" "$v"
              raw=$(grep -m1 "^$k=" .env 2>/dev/null | cut -d= -f2- | tr -d "\r" || true)
              [ -z "$raw" ] || [ "$raw" = "$v" ] || printf "::add-mask::%s\n" "$raw"
            done
            fp() { printf "%s" "$1" | sha256sum | cut -c1-8; }
            bad=0; seen=""
            printf "%-32s %-8s %-10s %s\n" KEY STATE SHA256/8 NOTE
            for k in $REQUIRED $SECRET SUPABASE_PUBLISHABLE_KEY; do
              case " $seen " in *" $k "*) continue ;; esac
              seen="$seen $k"; note=""
              v=$(get .env "$k")
              if [ -z "$v" ]; then
                case " $REQUIRED " in
                  *" $k "*) printf "%-32s %-8s %-10s %s\n" "$k" MISSING - "required"; bad=1 ;;
                  *)        printf "%-32s %-8s %-10s %s\n" "$k" unset - "optional" ;;
                esac
                continue
              fi
              case " $SECRET ANON_KEY " in
                *" $k "*)
                  if [ -f .env.example ] && [ "$v" = "$(get .env.example "$k")" ]; then
                    case " $REQUIRED " in
                      *" $k "*) note="INSECURE: still the .env.example default"; bad=1 ;;
                      *)        note="warning: .env.example default (only matters if you use it)" ;;
                    esac
                  fi ;;
              esac
              case "$k:$v" in *_URL:*localhost*) note="warning: still localhost" ;; esac
              printf "%-32s %-8s %-10s %s\n" "$k" set "$(fp "$v")" "$note"
            done
            echo
            echo "Public values (safe to share):"
            for k in $PUBLIC; do printf "  %s=%s\n" "$k" "$(get .env "$k")"; done
            echo
            echo "COMPOSE_FILE=$(get .env COMPOSE_FILE)"
            if [ "$bad" != 0 ]; then
              echo "::error::required keys missing or still the insecure defaults (see above). Set them with SUPABASE_ENV_<KEY> on supabase-manager (or upstream utils/ scripts), then reconcile."
              exit 1
            fi
            echo "All required keys set; none equal to the .env.example defaults."
          '
