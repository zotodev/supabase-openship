# The ONLY service Openship deploys. It manages the real Supabase stack
# (official docker/ compose, project name "supabase") in /srv/supabase on the
# host through the Docker socket. Configure it with env vars in Openship
# (see README). No ports: nothing to reach on this container.
services:
  supabase-manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    restart: unless-stopped
    volumes:
      # Full control of the host Docker daemon (= root on the host). Required.
      - /var/run/docker.sock:/var/run/docker.sock
      # MUST be the same path inside and outside: compose resolves ./volumes/...
      # bind sources inside this container but the host daemon mounts them.
      - /srv/supabase:/srv/supabase
      - /srv/supabase-backups:/srv/supabase-backups
    healthcheck:
      test: ["CMD", "manager", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 900s
