# Non-secret settings used by scripts/render.sh to generate openship-compose.yml.
# Secrets never go here - they live in .env (local, gitignored) and in Openship.

# Where this repo is cloned ON THE SERVER. All bind mounts are rendered as
# absolute paths under it (Openship passes bind mounts through unchanged).
SUPABASE_ROOT=/srv/supabase

# Host interface for published ports. 127.0.0.1 = only reachable on the box
# (put Openship's edge / Tailscale serve in front). Use your Tailscale IP
# (100.x.y.z) to expose only on the tailnet. Avoid 0.0.0.0.
BIND_ADDR=127.0.0.1

# Published host ports (container ports are fixed by upstream).
API_GW_HTTP_PORT=8000
POSTGRES_PORT=5432
POOLER_PROXY_PORT_TRANSACTION=6543

# Upstream override short names to layer (space separated), e.g. "rustfs".
# NOT supported under Openship: "logs" (Vector routes by container_name and
# needs docker.sock), "kong" (Realtime tenant routing relies on Host header =
# container name), "caddy"/"nginx" (use Openship's edge instead), "envoy" (no-op).
UPSTREAM_OVERRIDES=""

# Enable the asymmetric JWT keys (what upstream setup.sh does via
# utils/add-new-auth-keys.sh): uncomments GOTRUE_JWT_KEYS / API_JWT_JWKS /
# JWT_JWKS / SUPABASE_JWKS in a temp copy before rendering. 1 = on.
ASYMMETRIC_KEYS=1
